<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PS5LM</title>
<!--
  The chat page llama-server serves on the PS5 (:8081). Plain ES5 and
  XMLHttpRequest with no external files, because the console's browser renders
  modern bundles blank.
  It asks /health until the model is loaded, so a request is never sent into a
  server that is still loading; when a streamed answer produces nothing it asks
  again without streaming; and a failure shows the HTTP status and the server's
  own words instead of "stopped".
  SPDX-License-Identifier: GPL-3.0-or-later
-->
<style>
  :root {
    --bg: #000000; --surface: #0b0b0b; --raised: #0f0f0f; --field: #0d0b0b;
    --border: #2b2523; --text: #fafafa; --body: #ebebeb; --muted: #b5aea9; --faint: #9a9a9a;
    --accent: #6e81e4; --button: #fafafa; --quiet: #141414;
  }
  html { font-size: 20px; font-size: clamp(17px, 1.3vw, 26px); -webkit-text-size-adjust: 100%; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--body);
    font-family: "SST", "SST Roman", "SST-Roman", -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; line-height: 1.55; }
  body { display: flex; flex-direction: column; }
  a { color: var(--accent); text-decoration: none; }
  button:focus, input:focus { outline: 3px solid var(--text); outline-offset: 2px; }
  :focus-visible { outline: 3px solid var(--text); outline-offset: 2px; }

  .top { display: flex; align-items: center; gap: 1rem; height: 3.5rem; padding: 0 1.5rem;
    border-bottom: 1px solid var(--border); }
  .brand { color: var(--text); font-weight: 500; }
  .model { color: var(--muted); font-size: 0.875rem; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .top a { font-size: 0.875rem; padding: 0.5rem 0; }
  .state { font-size: 0.8125rem; color: var(--faint); white-space: nowrap; }
  .state.ready { color: #7bd8a4; }
  .state.wait { color: #f2c27a; }
  .state.bad { color: #ff9c97; }

  .scroll { flex: 1; overflow-y: auto; }
  .column { max-width: 46rem; margin: 0 auto; padding: 2rem 1.5rem; }

  .empty { padding-top: 12vh; }
  .empty h1 { color: var(--text); font-size: 2.25rem; font-weight: 300; margin: 0 0 0.4rem; }
  .empty p { color: var(--muted); margin: 0 0 2rem; }
  .ideas { display: flex; flex-direction: column; gap: 0.6rem; }
  .idea { text-align: left; font: inherit; font-size: 1rem; color: var(--body); background: var(--surface);
    border: 1px solid var(--border); border-radius: 4px; padding: 0.85rem 1.1rem; cursor: pointer; }
  .idea:hover { background: var(--quiet); color: var(--text); }

  .msg { margin: 0 0 1.75rem; white-space: pre-wrap; word-wrap: break-word; }
  .me { display: flex; justify-content: flex-end; }
  .me div { background: var(--raised); border: 1px solid var(--border); color: var(--text);
    border-radius: 6px; padding: 0.6rem 1rem; max-width: 80%; }
  .bot { color: var(--body); }
  .bot .meta { display: block; color: var(--faint); font-size: 0.8125rem; margin-top: 0.4rem; }
  .bot .error { color: #e5a29a; display: block; }
  .bot .hint { color: var(--faint); display: block; font-size: 0.8125rem; }
  .caret { display: inline-block; width: 0.5em; height: 1.1em; vertical-align: text-bottom; background: var(--muted); }

  .composer { border-top: 1px solid var(--border); background: var(--bg); }
  .composer form { max-width: 46rem; margin: 0 auto; padding: 1rem 1.5rem 1.25rem; display: flex; gap: 0.6rem; }
  .composer input { flex: 1; min-width: 0; font: inherit; color: var(--text); background: var(--surface);
    border: 1px solid var(--border); border-radius: 4px; padding: 0.8rem 1rem; }
  .composer input::placeholder { color: var(--faint); }
  .composer button { font: inherit; font-size: 0.9375rem; font-weight: 500; color: #000; background: var(--button);
    border: 0; border-radius: 4px; padding: 0 1.4rem; cursor: pointer; }
  .composer button:hover { background: #ffffff; }
  .composer button.stop { background: var(--quiet); color: var(--text); border: 1px solid var(--border); }
  .composer button:disabled { opacity: 0.45; cursor: default; }
</style>
</head>
<body>
<header class="top">
  <span class="brand">ps5lm</span>
  <span class="model" id="model"></span>
  <span class="state wait" id="state">连接中…</span>
  <a id="models" href="#">模型</a>
</header>

<div class="scroll" id="scroll">
  <div class="column" id="log">
    <div class="empty" id="empty">
      <h1>问点什么</h1>
      <p>一个跑在这台 PS5 自己的处理器上的语言模型。</p>
      <div class="ideas">
        <button class="idea" type="button">你是谁？</button>
        <button class="idea" type="button">写一首关于 PS5 的俳句</button>
        <button class="idea" type="button">用两句话说明 CPU 是怎么工作的</button>
      </div>
    </div>
  </div>
</div>

<div class="composer">
  <form id="form">
    <input id="input" type="text" autocomplete="off" placeholder="说点什么">
    <button id="send" type="submit" disabled>发送</button>
  </form>
</div>

<script>
(function () {
  // What the model knows about itself. The name fills in from /v1/models.
  var modelName = '一个语言模型';
  function systemPrompt() {
    return '你是 ' + modelName + '，一个开源权重的语言模型，用 PS5LM（llama.cpp 的移植）在这台 ' +
      'PlayStation 5 上本地运行。你跑在主机自己的 CPU 上，全程离线，对话不会离开这台主机。' +
      '如果有人问你是谁、在哪里运行，就用对方的语言回答，大意是：“我是 ' + modelName +
      '，就跑在这台 PS5 自己的处理器上，用的是 PS5LM。”' +
      '除非对方要求更多，否则回答控制在 1~3 句短句之内，并且始终用对方的语言回答。';
  }
  var log = document.getElementById('log');
  var scroller = document.getElementById('scroll');
  var form = document.getElementById('form');
  var input = document.getElementById('input');
  var send = document.getElementById('send');
  var stateBox = document.getElementById('state');
  var modelBox = document.getElementById('model');
  var messages = [];
  var xhr = null;
  var ready = false;

  // The native app has no model-library page (its library is on the TV) and
  // says so in app.json, which only it ships: without the file the link stays.
  var library = document.getElementById('models');
  library.href = 'http://' + location.hostname + ':8082/';
  xhrGet('/app.json', function (status, text) {
    if (status !== 200) return;
    try {
      if (JSON.parse(text).library === '') library.style.display = 'none';
    } catch (error) { /* not our file: keep the link */ }
  });

  function xhrGet(path, done) {
    var request = new XMLHttpRequest();
    request.open('GET', path);
    request.onloadend = function () { done(request.status, request.responseText || ''); };
    request.onerror = function () { done(0, ''); };
    request.send();
  }

  function setState(text, kind) {
    stateBox.textContent = text;
    stateBox.className = 'state ' + (kind || '');
  }

  // The model is loaded when /health says so; until then the server answers
  // /v1/chat/completions with an error and a request is wasted.
  function checkHealth() {
    xhrGet('/health', function (status, text) {
      var ok = false;
      if (status === 200) {
        ok = true;
        try { ok = JSON.parse(text).status === 'ok'; } catch (error) { ok = true; }
      }
      if (ok) {
        ready = true;
        send.disabled = false;
        setState('就绪', 'ready');
        input.focus();
      } else {
        ready = false;
        send.disabled = true;
        setState(status === 0 ? '连不上服务器' : '模型还没加载好', status === 0 ? 'bad' : 'wait');
        setTimeout(checkHealth, 2000);
      }
    });
  }

  function loadName() {
    xhrGet('/v1/models', function (status, text) {
      if (status !== 200) return;
      try {
        var id = JSON.parse(text).data[0].id;
        modelName = id.split('/').pop().replace(/\.gguf$/, '')
          .replace(/-(UD-)?(I?Q[0-9].*|BF16|F16|F32)$/i, '').replace(/-/g, ' ');
        modelBox.textContent = modelName;
      } catch (error) { /* keep the default name */ }
    });
  }

  checkHealth();
  loadName();

  function add(cls) {
    var empty = document.getElementById('empty');
    if (empty) empty.parentNode.removeChild(empty);
    var div = document.createElement('div');
    div.className = 'msg ' + cls;
    log.appendChild(div);
    return div;
  }
  function bottom() { scroller.scrollTop = scroller.scrollHeight; }
  function busy(on) {
    send.textContent = on ? '停止' : '发送';
    send.className = on ? 'stop' : '';
  }

  // What the server said, in its own words, is worth more than "failed".
  function describe(status, text) {
    if (status === 0) return '连接断了：服务器没在监听，或者刚被重启/停止。';
    var detail = '';
    try {
      var body = JSON.parse(text);
      detail = body.error && (body.error.message || body.error);
    } catch (error) {
      detail = (text || '').replace(/^\s+|\s+$/g, '').slice(0, 200);
    }
    return '服务器返回 ' + status + (detail ? '：' + detail : '。');
  }

  function parseStream(seen, pending) {
    return { seen: seen, pending: pending };
  }

  function ask(text) {
    messages.push({ role: 'user', content: text });
    if (messages.length > 12) messages = messages.slice(messages.length - 12);

    var mine = add('me');
    var box = document.createElement('div');
    box.textContent = text;
    mine.appendChild(box);

    var out = add('bot');
    var answer = document.createTextNode('');
    var caret = document.createElement('span');
    caret.className = 'caret';
    out.appendChild(answer);
    out.appendChild(caret);
    bottom();

    var spoken = '', seen = 0, pending = '';
    var streaming = true;

    function finish(text_) {
      if (caret.parentNode) caret.parentNode.removeChild(caret);
      if (text_) {
        answer.nodeValue = text_;
        messages.push({ role: 'assistant', content: text_ });
      }
      busy(false);
      bottom();
      input.focus();
    }

    function fail(status, text_) {
      var span = document.createElement('span');
      span.className = 'error';
      span.textContent = describe(status, text_);
      out.appendChild(span);
      if (status === 0 || status === 503) {
        ready = false;
        send.disabled = true;
        setState('模型还没加载好', 'wait');
        setTimeout(checkHealth, 2000);
      }
      finish('');
    }

    function whole() {
      // The streamed answer came to nothing: ask once more without streaming,
      // which needs no incremental responseText from the browser.
      var again = new XMLHttpRequest();
      again.open('POST', '/v1/chat/completions');
      again.setRequestHeader('Content-Type', 'application/json');
      again.onloadend = function () {
        if (again.status !== 200) { fail(again.status, again.responseText); return; }
        var body = null;
        try { body = JSON.parse(again.responseText); } catch (error) { body = null; }
        var text_ = body && body.choices && body.choices[0] && body.choices[0].message &&
          body.choices[0].message.content;
        if (!text_) { fail(again.status, again.responseText); return; }
        answer.nodeValue = text_;
        finish(text_);
      };
      again.send(JSON.stringify({
        messages: [{ role: 'system', content: systemPrompt() }].concat(messages),
        max_tokens: 256,
        chat_template_kwargs: { enable_thinking: false }
      }));
    }

    xhr = new XMLHttpRequest();
    xhr.open('POST', '/v1/chat/completions');
    xhr.setRequestHeader('Content-Type', 'application/json');

    xhr.onprogress = function () {
      if (!streaming) return;
      pending += xhr.responseText.substring(seen);
      seen = xhr.responseText.length;
      var lines = pending.split('\n');
      pending = lines.pop();
      for (var i = 0; i < lines.length; i++) {
        var line = lines[i].replace(/^\s+|\s+$/g, '');
        if (line.indexOf('data:') !== 0) continue;
        var data = line.substring(5).replace(/^\s+/, '');
        if (data === '[DONE]') continue;
        var chunk;
        try { chunk = JSON.parse(data); } catch (error) { continue; }
        var delta = chunk.choices && chunk.choices[0] && chunk.choices[0].delta;
        if (delta && delta.content) {
          spoken += delta.content;
          answer.nodeValue = spoken;
        }
        if (chunk.timings) {
          var meta = document.createElement('span');
          meta.className = 'meta';
          meta.textContent = chunk.timings.predicted_n + ' token，' +
            chunk.timings.predicted_per_second.toFixed(1) + ' token/秒';
          out.appendChild(meta);
        }
        bottom();
      }
    };

    xhr.onloadend = function () {
      streaming = false;
      if (xhr.onprogress) xhr.onprogress();
      var status = xhr.status, text_ = xhr.responseText || '';
      xhr = null;
      busy(false);
      if (spoken) { finish(spoken); return; }
      if (status !== 200) { fail(status, text_); return; }
      // 200 with nothing: this browser may not deliver a streamed body.
      if (!caret.parentNode) return;
      var hint = document.createElement('span');
      hint.className = 'hint';
      hint.textContent = '这个浏览器没有收到流式内容，改用整段回答重试一次…';
      out.appendChild(hint);
      whole();
    };

    xhr.send(JSON.stringify({
      messages: [{ role: 'system', content: systemPrompt() }].concat(messages),
      stream: true,
      max_tokens: 256,
      chat_template_kwargs: { enable_thinking: false }
    }));
    busy(true);
  }

  form.onsubmit = function (e) {
    e.preventDefault();
    if (xhr) { xhr.abort(); return; }
    if (!ready) { checkHealth(); return; }
    var text = input.value.replace(/^\s+|\s+$/g, '');
    if (!text) return;
    input.value = '';
    ask(text);
  };

  var ideas = document.querySelectorAll('.idea');
  for (var k = 0; k < ideas.length; k++) {
    ideas[k].onclick = function () { if (!xhr && ready) ask(this.textContent); };
  }
})();
</script>
</body>
</html>
